[project]
name = "gemma4-fine-tuning"
version = "0.3.0"
description = "Fine-tuning Gemma 3 1B with Unsloth + TRL on 4GB VRAM"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4.0",
    "transformers>=4.44.0",
    "peft>=0.12.0",
    "trl>=0.9.0",
    "accelerate>=0.33.0",
    "datasets>=2.19.0",
    "bitsandbytes>=0.44.0",
    "huggingface-hub>=0.24.0",
    "safetensors>=0.4.5",
    "wandb>=0.17.0",
    "unsloth>=2026.7.6",
    "loguru>=0.7.0",
    "liger-kernel>=0.3.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = ["data*", "unsloth_compiled_cache*", "*.pyc", "__pycache__*"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]
